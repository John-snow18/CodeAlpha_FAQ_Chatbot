<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mahabharata FAQ Chatbot</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <header>
        <div class="icon">🏹</div>

        <h1>Mahabharata FAQ</h1>

        <p>
            Ask questions about the characters, events and teachings
            of the Mahabharata.
        </p>
    </header>


    <div class="chat-box" id="chatBox">

        <div class="message bot">
            <div class="avatar">🤖</div>

            <div class="text">
                <b>Mahabharata Bot</b>
                <p>
                    Namaste! 🙏 Ask me anything about the Mahabharata.
                </p>
            </div>
        </div>

    </div>


    <div class="input-area">

        <input
            type="text"
            id="userInput"
            placeholder="Ask a question..."
            autocomplete="off"
        >

        <button onclick="sendMessage()">
            Ask
        </button>

    </div>


    <div class="examples">

        <p>Try asking:</p>

        <button onclick="askExample('Who was Arjuna?')">
            Who was Arjuna?
        </button>

        <button onclick="askExample('Who was Krishna?')">
            Who was Krishna?
        </button>

        <button onclick="askExample('Who was Karna?')">
            Who was Karna?
        </button>

        <button onclick="askExample('How long did the Kurukshetra War last?')">
            How long was the war?
        </button>

    </div>


    <footer>
        CodeAlpha Internship • FAQ Chatbot
    </footer>

</div>


<script>

function addMessage(message, sender) {

    const chatBox = document.getElementById("chatBox");

    const messageDiv = document.createElement("div");

    messageDiv.className = "message " + sender;


    const avatar = document.createElement("div");

    avatar.className = "avatar";

    avatar.textContent =
        sender === "bot" ? "🤖" : "👤";


    const textDiv = document.createElement("div");

    textDiv.className = "text";

    textDiv.innerHTML = "<p>" + message + "</p>";


    messageDiv.appendChild(avatar);

    messageDiv.appendChild(textDiv);

    chatBox.appendChild(messageDiv);


    chatBox.scrollTop = chatBox.scrollHeight;
}


async function sendMessage() {

    const input =
        document.getElementById("userInput");

    const question =
        input.value.trim();


    if (question === "") {
        return;
    }


    addMessage(question, "user");

    input.value = "";


    try {

        const response = await fetch("/ask", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                question: question
            })

        });


        const data = await response.json();

        addMessage(data.answer, "bot");


    } catch (error) {

        addMessage(
            "Sorry, something went wrong. Please try again.",
            "bot"
        );

    }

}


function askExample(question) {

    document.getElementById("userInput").value = question;

    sendMessage();

}


document.getElementById("userInput")
    .addEventListener("keypress", function(event) {

        if (event.key === "Enter") {

            sendMessage();

        }

    });

</script>

</body>
</html>
